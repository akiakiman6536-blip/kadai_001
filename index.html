<!DOCTYPE html>
<html lang="ja">
 <head>
  <title>DesignComp</title>
  <meta charset="utf-8">
  <meta name="description" content="カメラマンKazuki Asahinaの休日">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
 </head> 
<body>
   <!-- ヘッダー -->
 <header>
  <!-- ナビゲーションメニュー -->
    <nav id="nav-pc">
       <ul>
        <li><a href="index.html#about">MyProfile</a></li>
        <li><a href="index.html#works">About Works</a></li>
       </ul>
    </nav>
 </header>
<!-- メインコンテンツ -->
 <main>
  <article>
    <!-- メインビジュアル -->
    <section id="main-visual">      
     <img src="images/main.png" alt="カメラの写真">
    </section>

   <!--About-->
    <section id="about">
      <h2 class="index-h2">About</h2>
      <div class="about-flex">
        <!--左側写真-->
        <div id="about-photo">
          <img src="images/about.png" alt="カメラマンKazuki Asahinaの写真">
        </div>
        <!--右側自己紹介-->
        <div id="about-message">
          <h3>Kazuki Asahina</h3>
          <p>・25歳 長野県佐久市出身</p>
          <p>・ソフトウェア業界でマーケティングに従事</p>
          <p>・自然を撮影するのが好きで、海や山へよく行く</p>
        </div>
      </div>      
    </section>

    <!--works-->
    <section id="works">
      <h2 class="index-h2">Works</h2>
      <div class="works-flex">
        <div>
          <img class="works-photo" src="images/works1.png" alt="海の写真">
          <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</p>
        </div>
        <div>
          <img class="works-photo" src="images/works2.png" alt="山の写真">
          <p>地元長野の木曽町から撮影した冠雪した御獄山</p>
        </div>
        <div>
          <img class="works-photo" src="images/works3.png" alt="町の写真">
          <p>京都で撮影した、明け方の古き良き日本の町並み</p>
        </div>
      </div>

  </article>
 </main>

 <!-- フッター -->
 <footer>
  <p id="copyright">&copy;MyProfile. ALL rights reserved.</p>
 </footer>

</body>
</html>
